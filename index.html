<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión de Tareas - TaskFlow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>TaskFlow - Gestión de Tareas</h1>

    <!-- Formulario para Registrar Tarea -->
    <section class="card">
      <h2>Registrar Nueva Tarea</h2>
      <form id="task-form">
        <div class="form-group">
          <label for="title">Título de la tarea:</label>
          <input type="text" id="title" required placeholder="Ej. Implementar login">
        </div>

        <div class="form-group">
          <label for="description">Descripción:</label>
          <textarea id="description" rows="3" placeholder="Detalles de la tarea..."></textarea>
        </div>

        <button type="submit">Agregar Tarea</button>
      </form>
    </section>

    <!-- Listado de Tareas -->
    <section class="card">
      <h2>Lista de Tareas</h2>
      <div id="task-list" class="task-list">
        <p class="empty-msg">No hay tareas registradas.</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
